[project]
name = "margin-dspy"
version = "0.1.0"
description = "DSPy optimization for Margin writing quality system"
requires-python = ">=3.11"
dependencies = [
    "dspy>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
