name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  public-history:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: History starts at the public root commit
        run: sh scripts/guard/public-history-guard.sh --check HEAD

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.30.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm tsc --noEmit

      - name: Production build
        run: pnpm build

      - name: Frontend tests
        run: |
          mkdir -p test-results
          pnpm test -- --reporter=default --reporter=json --outputFile=test-results/vitest.json

      - name: MCP tests
        run: |
          mkdir -p test-results
          pnpm --filter mcp test -- --reporter=default --reporter=json --outputFile=test-results/mcp-vitest.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-test-results
          path: test-results/
          retention-days: 14

  backend:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install MCP server dependencies (bundled as margin-mcp)
        run: pnpm install --frozen-lockfile

      - name: Install Bun (builds the bundled margin-mcp)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install Go (builds the bundled margin-cli)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        run: |
          mkdir -p evidence
          cargo clippy --manifest-path src-tauri/Cargo.toml --message-format=json -- -D warnings \
            2>&1 | tee evidence/clippy.json

      - name: Rust tests
        run: |
          mkdir -p evidence
          cargo test --manifest-path src-tauri/Cargo.toml \
            2>&1 | tee evidence/cargo-test.txt

      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-evidence
          path: evidence/
          retention-days: 14
